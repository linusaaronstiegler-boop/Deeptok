<!--
  Welt-Fragment Atlas (Bühne, Beats 1-8): Karte, Orte, Waage mit Schild, Darsteller (Spieler,
  Beleg, Vertrag, Geld in Barcelona, Geld/Geist in München, Umriss des Spielers), Zeitleiste,
  Etiketten an Schalen und die Marker-Ebene. build/bauen.mjs setzt dieses Stück in
  compositions/atlas.html ein und füllt dabei Karte (@karte), Ländernamen (@laender), Münzen
  (@muenzen, @muenzen-muenchen), Geister (@geist-stapel, @geist-figur) und Spielfigur
  (@spielfigur) ein. Alle Positionen setzt lib/buehne.js -> render(t); hier steht nur das
  Aussehen. Maße der Waage: DATEN.waage (bauen.mjs), Farben: studio/DESIGN.md §4.

  Runde 1: Alles, was zur Welt gehört, liegt in EINER Hülle (#w-welt, data-rig). Die Nachfahrt
  (Detail-Zoom) vergrößert diese Hülle als Ganzes; das HUD darüber bleibt fest.

  Runde 2: Die Waage ist ein beleuchteter Gegenstand wie Figur und Münzen (Balken 18 px mit
  Lichtkante, Säule und Fuß als Fläche mit Licht links und Schatten rechts, Ketten 4 px). Die
  Zeitleiste ist auf das Vertragsblatt gedruckt, "0 €" ist ein zweiter Stempel. Am Schild
  "Behalten" gibt es den Stempel "0 €" ("Behalten keinen Cent"). Unter der Kosten-Schale stehen
  zwei Zeilen: der Betrag ("45 Mio. €", erst im Geist-Stil) und sein Wort ("entgangen" ->
  "beste Alternative").
-->
<style>
  /* @schriften:anfang */
  /* @schriften:ende */
  #w-buehne { position: absolute; inset: 0; overflow: hidden; background: #0E1726; }
  /* Welt-Hülle: Ursprung oben links, damit render() translate + scale einfach rechnen kann.
     isolation: immer ein eigener Stapelkontext (auch ohne Zoom gleiche Reihenfolge). */
  #w-welt { position: absolute; inset: 0; transform-origin: 0 0; isolation: isolate; }
  #w-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  /* Karte: entsättigt, dunkel, eine Region leuchtet (Kartentöne aus DESIGN.md §4). */
  #w-land { fill: #222D40; stroke: #5A6880; stroke-linejoin: round; filter: url(#w-papier); }
  #w-netz { fill: none; stroke: rgba(245, 240, 232, 0.08); }
  #w-grenzen { fill: none; stroke: #36435A; stroke-linejoin: round; }
  .w-hl { stroke-linejoin: round; }
  .w-hl .w-hl-flaeche { fill: #2A4069; stroke: none; }

  /* Weg des Spielers: Creme gepunktet (drehbuch.md, Abweichung 2: Gold zeigte vor der
     Denkpause auf die Antwort). Runde Kappen machen aus Strichen Punkte. */
  #w-route { fill: none; stroke: #F5F0E8; stroke-opacity: 0.85; stroke-linecap: round; }

  /* Anker: 0x0-Hülle am Ort, render() verschiebt sie. .w-rand blendet Namen vor dem Bildrand aus. */
  .w-anker { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .w-rand { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .w-ort { z-index: 2; }
  /* Der Name München liegt ÜBER der Waage (z 4): Beim Heranfahren verdeckte ihn sonst der
     Schatten des Waagenfußes halb (Kritik Prüfung 1). Der Punkt bleibt darunter. */
  #w-ortname-muenchen { z-index: 4; }
  .w-punkt { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%;
    background: #F5F0E8; box-shadow: 0 0 0 6px rgba(14, 23, 38, 0.85); }
  .w-name { position: absolute; top: -31px; white-space: nowrap;
    font-family: "DT Inter", sans-serif; font-weight: 600; font-size: 48px; line-height: 62px; color: #F5F0E8;
    text-shadow: 0 2px 18px rgba(14, 23, 38, 0.9), 0 0 4px rgba(14, 23, 38, 0.9); }
  /* Namen links vom Punkt: rechts davon stehen Spielfigur, Preisschilder und Stapel. */
  .w-name-links { right: 30px; }
  /* München: weiter links, damit der Fuß der Spielfigur den Namen nicht verdeckt. */
  #w-name-muenchen { right: 92px; }
  .w-rand.w-mitte { display: flex; justify-content: center; }

  /* Waage: ein Gegenstand der Welt wie Figur und Münzen (Runde 2, Prüfung 1: vorher ein
     Drahtgestell aus 2-px-Linien, am Handy unsichtbar). Licht von links oben wie bei der Figur:
     Navy-Fläche, Creme-Lichtkante oben/links, Navy-Schatten rechts/unten, Schlagschatten am Boden.
     Ketten 4 px Creme 80 % (DESIGN.md §7: Ketten 4 px). */
  #w-waage { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 3; }
  #w-waage-svg { position: absolute; left: -540px; top: -720px; width: 1080px; height: 800px; overflow: visible; }
  .wg-flaeche { fill: #1F3864; }
  .wg-schatten { fill: #0E1726; fill-opacity: 0.42; }
  .wg-kante { fill: none; stroke: #F5F0E8; stroke-opacity: 0.85; stroke-width: 4; stroke-linecap: round; }
  .wg-kante-leise { fill: none; stroke: #F5F0E8; stroke-opacity: 0.35; stroke-width: 3; stroke-linecap: round; }
  .wg-kette { fill: none; stroke: #F5F0E8; stroke-opacity: 0.8; stroke-width: 4; stroke-linecap: round; }
  /* Stempel "0 €" am Schild: Creme auf Navy (auf der Waage, nicht auf Papier) */
  .wg-stempel-rand { fill: #1F3864; stroke: #F5F0E8; stroke-width: 4; }
  .wg-stempel-text { font-family: "DT Inter", sans-serif; font-weight: 600; font-size: 48px; fill: #F5F0E8; }
  .wg-front-text { font-family: "DT Inter", sans-serif; font-weight: 600; font-size: 48px; fill: #F5F0E8; }
  /* Schild an der Säule: sagt, WELCHE Entscheidung die Waage wiegt ("Behalten", nach der
     Drehung "Verkaufen"). Navy-Fläche wie die Waage, Creme-Schrift. */
  .wg-schild-text { font-family: "DT Inter", sans-serif; font-weight: 600; font-size: 48px; fill: #F5F0E8; }

  /* Darsteller: Hülle = Fußpunkt (Mitte unten). render() besitzt Hülle, Figur-Neigung, Schatten. */
  .a-huelle { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; }
  .a-figur { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .a-schatten { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 4; }
  .a-schatten-oval { position: absolute; left: -96px; top: -20px; width: 192px; height: 40px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(14, 23, 38, 0.95), rgba(14, 23, 38, 0)); }
  .a-svg { position: absolute; left: -100px; top: -310px; width: 200px; height: 320px; overflow: visible; }
  .a-etikett { position: absolute; white-space: nowrap; font-family: "DT Inter", sans-serif; font-weight: 600;
    font-size: 52px; line-height: 62px; color: #F5F0E8; text-shadow: 0 2px 18px rgba(14, 23, 38, 0.9), 0 0 4px rgba(14, 23, 38, 0.9); }
  #a-spieler-name { right: 104px; top: -118px; font-size: 48px; }

  /* Preisschilder: Creme-Papier mit Loch, Navy-Schrift (Navy auf Creme 15,8 : 1). Sie hängen
     an Schnüren an der Hand der Figur, leicht versetzt und schräg (keine bündige Liste).
     Drehpunkt ist das Loch, darum pendeln sie beim Einhängen. Schnüre 3 px (am Handy sichtbar). */
  #a-schilder-faeden { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
  #a-schilder-faeden path { fill: none; stroke: #F5F0E8; stroke-opacity: 0.8; stroke-width: 3; stroke-linecap: round; }
  .a-schild { position: absolute; height: 76px; filter: drop-shadow(0 6px 10px rgba(14, 23, 38, 0.75)); }
  .a-schild-papier { position: absolute; inset: 0; background: #F5F0E8;
    clip-path: polygon(0 0, calc(100% - 40px) 0, 100% 50%, calc(100% - 40px) 100%, 0 100%); }
  .a-schild-loch { position: absolute; right: 22px; top: 31px; width: 14px; height: 14px; border-radius: 50%; background: #0E1726; }
  .a-schild-text { position: absolute; left: 24px; top: 7px; white-space: nowrap; font-family: "DT Inter", sans-serif;
    font-weight: 600; font-size: 48px; line-height: 62px; color: #0E1726; }
  .a-schild-dreh { position: absolute; inset: 0; }

  /* Papier-Gegenstände (Gehalt-Beleg, Vertrag): Creme-Papier, Navy-Druck, Stempel in Navy. */
  .a-papier { position: absolute; background: #F5F0E8; box-shadow: 0 8px 16px rgba(14, 23, 38, 0.7); transform-origin: 50% 100%; }
  .a-druck { position: absolute; white-space: nowrap; font-family: "DT Inter", sans-serif; font-weight: 600;
    font-size: 48px; line-height: 62px; color: #0E1726; }
  .a-zeile { position: absolute; height: 6px; background: #0E1726; opacity: 0.18; }
  .a-stempel { position: absolute; padding: 0 6px; border: 4px solid #1F3864; border-radius: 8px;
    font-family: "DT Inter", sans-serif; font-weight: 600; font-size: 48px; line-height: 58px; color: #1F3864; white-space: nowrap; }
  /* Beleg 196 breit (Runde 2): Er steht NEBEN dem Geist, nicht davor (Prüfung 1). */
  #a-beleg-papier { left: -98px; top: -232px; width: 196px; height: 232px; transform: rotate(-2deg); }
  #a-beleg-titel { left: 0; right: 0; top: 18px; text-align: center; }
  #a-beleg-stempel { left: 5px; top: 128px; }
  /* Vertrag (Runde 2, Prüfung 1): EIN Blatt trägt alles, was der Vertrag sagt. Die Zeitleiste ist
     daraufgedruckt (Band = eine Saison bis zum 30.06.2023), dahinter die gestrichelte Verlängerung,
     die auf "nicht" zurücktritt; "ablösefrei" und "0 €" sind zwei Stempel. Vorher schwebten
     Zeitleiste und "0 €" ohne Verbindung auf der Karte. */
  #a-vertrag-papier { left: -360px; top: -370px; width: 720px; height: 370px; transform: rotate(-1deg); }
  #a-vertrag-titel { left: 32px; top: 18px; }
  #a-vertrag-datum { left: 32px; top: 80px; }
  #a-vertrag-stempel { left: 430px; top: 34px; }
  #a-vertrag-null { left: 436px; top: 172px; }
  .zl { position: absolute; }
  .zl-strich { background: #0E1726; border-radius: 4px; }
  #zl-start { left: 36px; top: 238px; width: 8px; height: 44px; }
  #zl-band { left: 40px; top: 255px; width: 360px; height: 10px; transform-origin: 0 50%; }
  #zl-ende { left: 396px; top: 238px; width: 8px; height: 44px; }
  #zl-verl { left: 414px; top: 257px; width: 270px; height: 0; border-top: 6px dashed rgba(14, 23, 38, 0.6); }
  #zl-saison { left: 126px; top: 180px; }
  #zl-verl-text { left: 430px; top: 284px; }

  /* Etiketten an der Waage (an Schalen verankert). Gold nur für die gesuchte Größe. */
  .w-etikett { position: absolute; white-space: nowrap; font-family: "DT Inter", sans-serif; font-weight: 600;
    font-size: 52px; line-height: 62px; text-shadow: 0 2px 18px rgba(14, 23, 38, 0.9), 0 0 4px rgba(14, 23, 38, 0.9); }
  .w-gold { color: #C9A84C; }
  .w-creme { color: #F5F0E8; }
  /* Zeilen unter der LINKEN Schale (seite:links, immer "Kosten"): linksbündig an x = 108.
     Zeile 1 der Betrag, Zeile 2 sein Wort (Runde 2, Prüfung 2: Beim Begriff fehlte sonst die Zahl). */
  #w-reihe-l { z-index: 6; }
  #w-reihe-l .w-etikett { left: -164px; top: 80px; }
  #w-reihe-l .w-zeile2 { top: 142px; }
  #w-ok { line-height: 62px; }
  #w-reihe-l #w-saison { top: 204px; }
  /* "45 Mio. €" im Geist-Stil: gestrichelte Gold-Unterkante wie der Umriss des Geistes (nur eine
     Möglichkeit). Auf "genauso" wird die Zahl fest (volle Deckkraft) und der Strich geht. */
  #w-zahl-strich { position: absolute; left: 0; right: 0; top: 60px; height: 0; border-top: 5px dashed #C9A84C; }
  #w-tore-anker { z-index: 6; }
  #w-tore { left: -222px; top: -170px; }

  /* Licht: Vignette (radial, kein linearer Verlauf: der bildet im H.264-Video Streifen). */
  #w-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(115% 75% at 50% 50%, rgba(14, 23, 38, 0) 55%, rgba(5, 9, 17, 0.7) 100%); }
  #m-ebene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 7; overflow: visible; pointer-events: none; }
</style>
<div id="w-buehne">
 <div id="w-welt" data-rig>

  </div>

        <div class="a-zeile" style="left: 22px; right: 22px; top: 96px"></div>
        <div class="a-zeile" style="left: 22px; right: 70px; top: 112px"></div>
        <div class="a-zeile" style="left: 22px; right: 110px; top: 200px"></div>
        <div id="a-beleg-stempel" class="a-stempel">bezahlt</div>
      </div>
    </div>
  </div>

  <!-- Darsteller 3: der Vertrag (Beat 4), ein Blatt wie der Beleg. Stempel "ablösefrei". -->
  <div id="a-vertrag" class="a-huelle">
    <div id="a-vertrag-figur" class="a-figur">
      <div id="a-vertrag-papier" class="a-papier">
        <div id="a-vertrag-titel" class="a-druck">Vertrag</div>
        <div id="a-vertrag-datum" class="a-druck">bis 30.06.2023</div>
        <!-- Zeitleiste auf dem Blatt: eine Saison = das Band bis zum Vertragsende -->
        <div id="zl-saison" class="zl a-druck">1&nbsp;Saison</div>
        <div id="zl-start" class="zl zl-strich"></div>
        <div id="zl-band" class="zl zl-strich"></div>
        <div id="zl-ende" class="zl zl-strich"></div>
        <div id="zl-verl" class="zl"></div>
        <div id="zl-verl-text" class="zl a-druck">verlängern</div>
        <div id="a-vertrag-stempel" class="a-stempel" style="transform: rotate(-7deg)">ablösefrei</div>
        <div id="a-vertrag-null" class="a-stempel" style="transform: rotate(4deg)">0&nbsp;€</div>
      </div>
    </div>
  </div>

  <!-- Darsteller 4: das Geld in Barcelona (Gold = gesuchte Größe). Es bleibt dort. -->
  <div id="a-geld-schatten" class="a-schatten"><div class="a-schatten-oval"></div></div>
  <div id="a-geld" class="a-huelle">
    <div id="a-geld-figur" class="a-figur">
      <svg id="a-geld-bild" class="a-svg" viewBox="-100 -310 200 320" aria-hidden="true"><!-- @muenzen --></svg>
    </div>
  </div>

  <!-- Darsteller 5: das Geld in München. Erst ein GEIST (gestrichelt = nur eine Möglichkeit),
       ab "Bayern nimmt das Geld" echt (Morph: Umriss -> Münzen). -->
  <div id="a-geist" class="a-huelle">
    <div id="a-geist-figur" class="a-figur">
      <svg id="a-geist-umriss" class="a-svg" viewBox="-100 -310 200 320" aria-hidden="true"><!-- @geist-stapel --></svg>
      <svg id="a-geist-echt" class="a-svg" viewBox="-100 -310 200 320" aria-hidden="true"><!-- @muenzen-muenchen --></svg>
    </div>
  </div>

  <!-- Darsteller 6: der Umriss des Spielers. Er bleibt auf der Kosten-Schale, wenn der Spieler
       abfliegt: Das, was Verkaufen kostet, ist nicht mehr da. -->
  <div id="a-umriss" class="a-huelle">
    <div id="a-umriss-figur" class="a-figur">
      <svg id="a-umriss-bild" class="a-svg" viewBox="-100 -310 200 320" aria-hidden="true"><!-- @geist-figur --></svg>
    </div>
  </div>

  <!-- Etiketten unter der linken Schale (immer "Kosten"): Zeile 1 "45 Mio. €" (erst Geist-Stil),
       Zeile 2 "entgangen" -> "beste Alternative" (Morph); nach der Drehung "Opportunitätskosten"
       und "1 Saison". Kein Name mehr unter der Nutzen-Schale (40 px, unter der Schriftstufe). -->
  <div id="w-reihe-l" class="w-anker" data-anker="seite:links">
    <div id="w-reihe-zahl" class="w-etikett w-gold"><span id="w-zahl-text">45&nbsp;Mio.&nbsp;€</span><div id="w-zahl-strich"></div></div>
    <div id="w-reihe-entgangen" class="w-etikett w-gold w-zeile2">entgangen</div>
    <div id="w-reihe-alternative" class="w-etikett w-gold w-zeile2">beste Alternative</div>
    <div id="w-ok" class="w-etikett w-gold">Opportunitäts-<br />kosten</div>
    <div id="w-saison" class="w-etikett w-gold">1&nbsp;Saison</div>
  </div>
  <div id="w-tore-anker" class="w-anker" data-anker="schale:rechts"><div id="w-tore" class="w-etikett w-creme">Tore</div></div>

  <!-- Marker-Ebene: handgezeichnete Striche, die an Darstellern kleben (data-anker). -->
  <svg id="m-ebene" viewBox="0 0 1080 1920" aria-hidden="true" data-layout-ignore>
    <g id="m-anker-geld" data-anker="akteur:geist" data-anker-dy="-144"></g>
  </svg>
 </div>
</div>
