    (function () {

      const tl = gsap.timeline({ paused: true });
      // Seek-sicher: nur fromTo; ab dem zweiten Tween auf derselben Eigenschaft immediateRender: false.
      const rein = (sel, t, d) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: d || 0.2, ease: "power2.out" }, t);
      // Austritt: 40–50 % der Eintrittsdauer, Unschärfe plus Deckkraft, power2.in (DESIGN.md §5).
      const raus = (sel, t, d) => tl.fromTo(sel, { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: d || 0.2, ease: "power2.in", immediateRender: false }, t);
      const hart = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t);
      // Marker zeichnen: Strichmuster L/L+20, Offset L+10 -> 0; bis zum Cue unsichtbar (runde Kappe).
      const zeichne = (sel, t, d, ease) => document.querySelectorAll(sel).forEach((p) => {
        let L = 0;
        try { L = p.getTotalLength(); } catch (e) { L = 0; }
        if (!(L > 0)) L = parseFloat(p.dataset.laenge) || 1000;
        p.setAttribute("stroke-dasharray", L.toFixed(1) + " " + (L + 20).toFixed(1));
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t);
        tl.fromTo(p, { strokeDashoffset: L + 10 }, { strokeDashoffset: 0, duration: d, ease: ease || "power1.inOut" }, t);
      });

      // Beat 1 – Ort setzen: Punkt rastet ein, Name +0,12 s aus der Unschärfe (DESIGN.md §5, Atlas).
      tl.fromTo("#an-punkt i", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 0.433);
      rein("#an-ort", 0.553);
      // Fallen: Der Stapel fällt 560 px auf Barcelona, staucht beim Aufprall und federt zurück.
      tl.fromTo("#an-stapel-k", { y: -560 }, { y: 0, duration: 0.42, ease: "power2.in" }, 0.983);
      tl.fromTo("#an-stapel-k", { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 0.84, duration: 0.07, ease: "power2.out", immediateRender: false }, 1.403);
      tl.fromTo("#an-stapel-k", { scaleY: 0.84 }, { scaleY: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 1.473);
      tl.fromTo("#an-schatten svg", { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power2.in" }, 0.983);
      // Der Punkt geht, sobald ein Gegenstand auf dem Ort steht (der Fuß markiert den Ort).
      tl.fromTo("#an-punkt", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, 1.383);
      rein("#an-zahl", 1.433);
      rein("#an-c-abl", 1.433);
      zeichne("#an-marker-a .strich", 2.233, 0.35);
      // Übergang: Beat-1-Texte treten zurück, dann fährt die Kamera (0,6 s, power2.inOut) zum
      // Überblick Barcelona–München. Die Anker laufen mit derselben Kurve mit, so bleiben Stapel und
      // Namen auf ihrem Ort, obwohl sie bildschirmgroß bleiben.
      raus("#an-zahl", 5.4);
      raus("#an-marker-a", 5.4);
      raus("#an-c-abl", 5.4);
      tl.fromTo("#an-kamera", { scale: 1, x: 0, y: 0 }, { scale: 0.62, x: 24.68, y: 610.35, duration: 0.6, ease: "power2.inOut" }, 5.65);
      tl.fromTo("#an-bcn", { x: 0, y: 0 }, { x: -172.9, y: 276.0, duration: 0.6, ease: "power2.inOut" }, 5.65);

      tl.fromTo("#an-spanien", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 5.65);
      tl.fromTo("#an-deutschland", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 5.95);
      // Beat 2: München setzen, Geist-Stapel (leer), Datum, „0 €“ in Creme mit Unterstreichung.
      tl.fromTo("#an-muc-punkt i", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 6.283);
      rein("#an-muc-name", 6.403);
      rein("#an-geist", 6.80, 0.3);
      rein("#an-bis", 7.033);
      rein("#an-c-vertrag", 7.033);
      rein("#an-null", 9.233);
      rein("#an-c-frei", 9.233);
      zeichne("#an-marker-b .strich", 9.633, 0.35);
      tl.to({}, { duration: 12.0 }, 0);
