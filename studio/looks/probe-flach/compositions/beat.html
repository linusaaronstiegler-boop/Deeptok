    (function () {

      const tl = gsap.timeline({ paused: true });

      const raus = (sel, t, d) => tl.fromTo(sel, { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: d || 0.2, ease: "power2.in", immediateRender: false }, t);
      const hart = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t);
      // Marker zeichnen: Strichmuster L/L+20, Offset L+10 -> 0; bis zum Cue unsichtbar (runde Kappe).
      const zeichne = (sel, t, d, ease) => document.querySelectorAll(sel).forEach((p) => {
        let L = 0;
        try { L = p.getTotalLength(); } catch (e) { L = 0; }
        if (!(L > 0)) L = parseFloat(p.dataset.laenge) || 1000;
        p.setAttribute("stroke-dasharray", L.toFixed(1) + " " + (L + 20).toFixed(1));
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, t);
        tl.fromTo(p, { strokeDashoffset: L + 10 }, { strokeDashoffset: 0, duration: d, ease: ease || "power1.inOut" }, t);
      });

      // Morph Foto → Zeichnung (DESIGN.md §5): das Foto wird unscharf und größer, die Zeichnung
      // kommt 0,06 s später aus der Unschärfe und aus 72 % Größe. Derselbe Ort, jetzt als Modell.
      tl.fromTo("#fl-foto", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 1.3, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, 1.833);

      // Stadion von y ≈ 1860 aus und lag beim Morph über dem Foto-Credit (Gegenlese 28.10.).

      // Ploppen: Lage und Größe federn (back.out), Deckkraft nur 0,08 s linear (DESIGN.md §5).
      const ploppe = (sel, t, von, ursprung) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, t);
        tl.fromTo(sel, { scale: von, transformOrigin: ursprung }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, t);
      };
      ploppe("#fl-ort-text", 1.833, 0.7, "0% 70%");
      // Wachsen: der Geldstapel wächst aus dem Anstoßpunkt (svgOrigin in SVG-Koordinaten, siehe oben;

      tl.fromTo("#fl-geld", { scaleY: 0, svgOrigin: "540 1030" }, { scaleY: 1, duration: 0.5, ease: "back.out(1.6)" }, 2.383);
      // Das Preisschild schwingt an seiner Schnur ein (Drehung federt um das Loch).
      tl.fromTo("#fl-schild-dreh", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 2.833);
      tl.fromTo("#fl-schild-dreh", { rotation: -24, scale: 0.7 }, { rotation: -3, scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 2.833);
      zeichne("#fl-schnur", 2.933, 0.25, "power2.out");
      zeichne("#fl-pinsel-a", 3.633, 0.35, "power2.inOut");
      // Beat 2: Titel wechselt, das Kalenderblatt ploppt auf den Boden.
      raus("#fl-ort", 5.70);
      ploppe("#fl-beh-text", 5.933, 0.7, "0% 70%");
      tl.fromTo("#fl-kalender-dreh", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 7.033);
      tl.fromTo("#fl-kalender-dreh", { scale: 0.55, rotation: -12 }, { scale: 1, rotation: -3, duration: 0.45, ease: "back.out(2.2)" }, 7.033);
      // Morph: aus dem Geld wird sein Umriss (es kommt nicht), aus „45 Mio. €“ wird „0 €“.
      raus("#fl-pinsel-a", 9.233, 0.15);
      tl.fromTo("#fl-geld", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", immediateRender: false }, 9.233);
      tl.fromTo("#fl-geist", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 9.293);
      tl.fromTo("#fl-zahl", { opacity: 1, scale: 1, filter: "blur(0px)", transformOrigin: "0% 60%" }, { opacity: 0, scale: 1.3, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, 9.233);
      tl.fromTo("#fl-null", { opacity: 0, scale: 0.72, filter: "blur(10px)", transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 9.293);
      zeichne("#fl-pinsel-b", 9.633, 0.3, "power2.inOut");
      rein("#fl-c-abl", 2.833);
      rein("#fl-c-vertrag", 7.033);
      raus("#fl-c-abl", 9.103, 0.12);     // die Ablöse ist weg, ihre Quelle geht mit
      rein("#fl-c-frei", 9.353);
      tl.to({}, { duration: 12.0 }, 0);
