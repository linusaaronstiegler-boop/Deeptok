<!doctype html>
<!--
  Variante A "Bühne": Die Welt (Karte, Kamera, Darsteller, Marker) lebt in EINER
  langen Sub-Komposition "buehne". Die Szenen sind nur Abschnitte ihrer Zeitachse
  (Labels "start", "flug", "ziel"). Fester HUD-Text liegt in der Sub-Komposition
  "hud" darüber. Die Wurzel hält nur die beiden Hosts.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0E1726; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="buehne" data-composition-id="buehne" data-composition-src="compositions/buehne.html"
        data-start="0" data-duration="15" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html"
        data-start="0" data-duration="15" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
