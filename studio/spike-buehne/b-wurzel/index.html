<!doctype html>
<!--
  Variante B "Wurzel": Welt, Kamera und Darsteller liegen in der Wurzel-Komposition
  (diese Datei) und laufen auf der Wurzel-Zeitachse "main". Die Szenen "start",
  "flug" und "ziel" sind getrennte Sub-Kompositionen darüber und tragen nur
  festen HUD-Text und Marker in Bildschirm-Pixeln (sie kennen die Kamera nicht).
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0E1726; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <!-- @welt:anfang -->
<style>
    /* @schriften:anfang */
@font-face { font-family: "DT Playfair"; src: url("assets/fonts/playfair-display-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: block; }
@font-face { font-family: "DT Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "DT Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
/* @schriften:ende */
  #w-buehne { position: absolute; inset: 0; overflow: hidden; background: #0E1726; }
  #w-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  /* Simplicissimus-Karte: entsättigt, dunkel, eine Region leuchtet.
     Die Küste ist der Rand der Landfläche (ein Pfad statt zwei: halb so viele Daten). */
  #w-land { fill: #222D40; stroke: #5A6880; stroke-linejoin: round; filter: url(#w-papier); }
  #w-netz { fill: none; stroke: rgba(245, 240, 232, 0.08); }
  #w-grenzen { fill: none; stroke: #36435A; stroke-linejoin: round; }
  /* Hervorhebung als farbiger Schein: angehobenes Blau aus der Palette (#1F3864)
     statt grauer Fläche mit weißem Rand. Der Rand bleibt leise, damit ein
     Marker-Kreis (Creme) das einzige helle Zeichen im Bild ist. */
  .w-hl { stroke-linejoin: round; }
  .w-hl .w-hl-flaeche { fill: #2A4069; stroke: none; }
  .w-hl .w-hl-schein { fill: none; stroke: #6F8FC4; stroke-opacity: 0.55; filter: url(#w-weich); }
  .w-hl .w-hl-rand { fill: none; stroke: #9DB2D6; stroke-opacity: 0.7; }
  #w-spur { fill: none; stroke: #C9A84C; stroke-linecap: round; opacity: 0.9; }

  /* Anker: 0x0-Hülle am Weltort, render() verschiebt sie. Kinder sind frei.
     .w-rand ist eine zweite Hülle um einen Namen: render() blendet sie aus,
     bevor der Name den Bildrand erreicht (GSAP besitzt nur das Kind darin). */
  .w-anker { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; }
  .w-rand { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .w-punkt { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%;
    background: #F5F0E8; box-shadow: 0 0 0 6px rgba(14, 23, 38, 0.85); }
  .w-name { position: absolute; left: 30px; top: -31px; white-space: nowrap;
    font-family: "DT Inter", "Inter", sans-serif; font-weight: 600; font-size: 48px; line-height: 62px; color: #F5F0E8;
    text-shadow: 0 2px 14px rgba(14, 23, 38, 0.95), 0 0 4px rgba(14, 23, 38, 0.9); }
  #w-name-barcelona { left: 118px; }
  #w-name-muenchen { left: -118px; top: 38px; width: 236px; text-align: center; }
  /* Ländernamen: gesperrte Versalien wie auf einer gedruckten Karte, leise.
     Zentriert ohne CSS-transform: Eine 0 px breite Flex-Hülle mit
     justify-content: center lässt den Namen links und rechts gleich weit
     überstehen. So misst offsetLeft/offsetWidth genau den Text (Randblende). */
  .w-rand.w-mitte { display: flex; justify-content: center; }
  .w-land-name { position: relative; top: -21px; flex: none; white-space: nowrap;
    font-family: "DT Inter", "Inter", sans-serif; font-weight: 600; font-size: 34px; line-height: 42px;
    letter-spacing: 0.32em; color: rgba(245, 240, 232, 0.46); }

  /* Darsteller: das Geld. Hülle = Bodenpunkt (Mitte unten des Stapels).
     Größe 288 px = 15 % der Bildhöhe: ein Gegenstand, kein Symbol. */
  #d-huelle { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 3; }
  #d-figur { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #d-muenzen { position: absolute; left: -120px; top: -250px; width: 240px; height: 288px; overflow: visible; }
  #d-zahl { position: absolute; left: -70px; top: -104px; white-space: nowrap;
    font-family: "DT Playfair", "Playfair Display", serif; font-weight: 900; font-size: 173px; line-height: 200px;
    letter-spacing: -0.02em; color: #C9A84C;
    font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
  #d-schatten { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; }
  #d-schatten-oval { position: absolute; left: -110px; top: -24px; width: 220px; height: 48px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(3, 7, 14, 0.85), rgba(3, 7, 14, 0)); }

  /* Licht: Vignette als radialer Verlauf (kein linearer, der würde im
     H.264-Video Streifen bilden). Sie liegt über der Karte, aber unter Namen
     und Darsteller (die bleiben klar). Kein Filmkorn: Festes Korn mit 6 %
     verdoppelte die Datei und war im Handy-Blatt nicht zu sehen. */
  #w-vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(115% 75% at 50% 52%, rgba(14, 23, 38, 0) 55%, rgba(5, 9, 17, 0.72) 100%); }
</style>

 * Kreis (um einen Ort oder eine Zahl) und Unterstreichung (unter einer Zahl).
 * Vorbild: Simplicissimus (rote Kreise auf Karten) und Veritasium

 *   2. Nur fromTo-Tweens mit beiden Endpunkten. Ein `from` liest seinen

/*
 * DeepTok Bühne (Spike-Version): Welt + Kamera + Darsteller
 *
 * Idee: Alles, was sich in der Welt bewegt, ist ein Zahlen-ZUSTAND (z). Der
 * Zustand kommt aus einem PLAN: pro Größe eine Liste von Schlüsselbildern
 * ("bei Sekunde 3,9 steht die Kamera auf Barcelona, Zoom 3,2"). Daraus folgt
 * jedes Bild in zwei Schritten:
 *   berechne(t): Zeit t -> Zustand -> fertige Werte (Strings). Rein: liest
 *                kein DOM, schreibt kein DOM. Darum kann ein Test sie aufrufen
 *                und mit dem vergleichen, was im DOM steht (build/seek-test.mjs).
 *   render(t):   schreibt diese Werte ins DOM.

 *
 * Warum so und nicht "GSAP bewegt die Elemente direkt"?
 *   - Die Kamera skaliert die Welt. Der Darsteller und die Beschriftungen sollen
 *     aber auf dem Bildschirm gleich groß bleiben und trotzdem an ihrem Weltort
 *     kleben. Das geht nur, wenn eine Stelle Kamera UND Weltort kennt: render().
 *   - render(t) hängt nur von t ab. Springt der Player auf Sekunde 9, rechnet
 *     render(9) genau dieses Bild aus, egal was vorher lief (seek-sicher).
 *   - Ob GSAP-Tweens auf ein Zustandsobjekt dasselbe leisten, steht in REVIEW.md
 *     (Gegenprobe). Die Spuren hier sind eine Entwurfsentscheidung.
 *
 * Arbeitsteilung, damit sich nichts in die Quere kommt:
 *   render() besitzt die Hüllen (Kamera-Gruppe, Anker, .w-rand, Darsteller-Hülle,
 *   Schatten, Hervorhebungen). GSAP besitzt nur deren Kinder (Deckkraft,
 *   Unschärfe, Maßstab) und die HUD-Texte.
 *
 * Wird beim Bauen (build/bauen.mjs) zwischen @buehne:anfang/@buehne:ende eingesetzt.
 */

  "use strict";
  if (window.DeepTokBuehne) return;

  // Quadratische Bézier-Kurve: Punkt bei Parameter s (0..1)

    var b = 2 * (1 - s) * s;
    var c = s * s;

   * Längen-Tabelle der Route: Damit u = 0,5 wirklich "halbe Strecke" heißt
   * (und nicht halber Kurvenparameter), wird die Kurve einmal abgetastet.
   */

    var hi = tab.laengen.length - 1;

    var B = opts.breite || 1080;
    var H = opts.hoehe || 1920;

      hlEs: 0, // Hervorhebung Spanien 0..1

    function welt2bild(x, y, k) {
      k = k || z;
      return { x: (x - k.kx) * k.zoom + B / 2, y: (y - k.ky) * k.zoom + H / 2 };
    }

    var GRUNDWERT = { sicht: 1, spurSicht: 1 };

     * berechne(t): alle Werte eines Bildes als fertige Strings, ohne DOM.

    function berechne(t) {
      zustandBei(t || 0);
      var s = z.zoom;
      var e = {};

      // 1) Kamera: eine SVG-Transformation auf der Welt-Gruppe. SVG statt
      //    CSS-transform, damit Chrome die Vektoren bei jedem Zoom scharf neu zeichnet.

      // bildschirmgroß. Namen verblassen vor dem Aktionsrand und, wenn sie
      // data-bis-zoom tragen (Ländernamen), beim Heranfahren.
      for (var k = 0; k < anker.length; k++) {

        var abstand = Math.min(

          B - RAND_X - (p.x + bx.l + bx.b),
          p.y + bx.o - RAND_Y,
          H - RAND_Y - (p.y + bx.o + bx.h),

      berechne: berechne,

      zustandBei: zustandBei,
